# ============================================================================
# CareBank Frontend - CI Workflow
# ============================================================================
# Triggers on pull requests to main/develop branches.
# Lint, type check, and build MUST pass before a PR can be merged.
# Configure branch protection rules in GitHub Settings to enforce this.
# ============================================================================

name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  # Gate job - all checks must pass for PR merge
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.lint-and-build.result }}" != "success" ]]; then
            echo "CI checks failed: lint-and-build=${{ needs.lint-and-build.result }}"
            exit 1
          fi
          echo "All CI checks passed"
